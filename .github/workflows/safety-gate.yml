# Safety gate for the source of whittworkstudios.com. Runs on every pull request into board-edits and every push
# to it. It builds the public copy exactly as a release does (tools/release/build.py) and checks THAT, since the
# built copy is what ships: no leaked keys, CSP hash current, CSP no looser than tools/ci/csp-baseline.json, the
# tree really is build output, every internal link resolves, the HTML parses, the render-mode tripwires hold in
# headless Chrome, and analytics stays consent-gated. Nothing here deploys or reads a secret.
# Third-party code is pinned: actions by commit hash, gitleaks by version and sha256, html-validate by version.
name: safety-gate

on:
  pull_request:
    branches: [board-edits]
  push:
    branches: [board-edits]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safety-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit for keys and tokens
        run: '"$RUNNER_TEMP/gitleaks" git . --config tools/ci/gitleaks.toml --redact --no-banner --verbose'

  site-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Build folder outside the checkout
        run: echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: CSP hash matches the inline head script
        run: python3 -I tools/release/csp_hash.py
      - name: Build the public copy
        id: build
        run: |
          python3 -I tools/release/build.py "$OUT"
          rm "$OUT/.ww-build"
      # Each check below runs even when another failed, so one red line never hides the next.
      - name: Tree is build output, CNAME and Search Console file intact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -I tools/ci/site_checks.py built "$OUT"
      - name: CSP is no looser than the baseline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -I tools/ci/site_checks.py csp "$OUT" tools/ci/csp-baseline.json
      - name: Every internal link and asset exists
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -I tools/ci/site_checks.py links "$OUT"
      - name: HTML parses cleanly
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: find "$OUT" -name '*.html' ! -name 'google*.html' -print0 | xargs -0 npx --yes html-validate@11.17.0 -c tools/ci/htmlvalidate.json
      # Chrome's first launch on a fresh runner can outlast cdp.mjs's 20 s wait for its debug port.
      - name: Warm up Chrome
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: google-chrome --headless=new --disable-gpu --dump-dom about:blank > /dev/null
      - name: Render-mode tripwires hold in headless Chrome
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: SITE_ROOT="$OUT" node tools/ci/tripwires.mjs
      - name: Analytics stays consent-gated
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: SITE_ROOT="$OUT" node tools/verify/analytics-check.mjs
