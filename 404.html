<!DOCTYPE html>

<title>Nothing pinned here | WhittWorks Studios</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#04367B">

<!-- The other two pages carry a policy and this one did not, which is
     backwards: GitHub Pages serves this file for every unmatched path under
     the domain, so it is the page that scanners probing for /wp-login.php
     actually reach. It is also the easiest page on the site to lock down,
     because it runs no script at all -- hence script-src 'none' rather than
     the home page's 'self' 'unsafe-inline'. Everything it does need is
     first-party: one woff2 file and the favicons, plus the inline style
     block and the inline W mark. connect-src and
     form-action are 'none' because there is nothing here to send anywhere. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'none'; connect-src 'none'; base-uri 'self'; form-action 'none'; object-src 'none'">

<!-- ==================================================================
     THE 404
     ==================================================================
     GitHub Pages serves this file, with a real 404 status, for every path
     under the domain that is not a file in this repo. So it gets hit by
     typos, by stale links, and by scanners probing for /wp-login.php, and
     none of those visitors asked for 1.6MB of photographed paper.

     So there is no board here. No cork, no scans, no camera, no scripts:
     one white card on the brand navy, drawn entirely in CSS, carrying the W
     mark inline. The only fetches are League Spartan (22KB, the same file the
     home page preloads, so it is warm in the cache on the way home) and the
     favicon. Rebranded 2026-10-28 to the blue logo; the Permanent Marker and
     Space Mono look it used to share with the board is gone.

     Every URL here is ROOT-ABSOLUTE (/assets/...). Pages serves this file at
     whatever path was missed, so /wp-admin/login.php resolved a relative
     "assets/favicon-32.png" to /wp-admin/assets/... and the fonts 404'd too.
     The catch: on the staging project site, which lives under a subpath,
     these resolve to the domain root and miss. Production is the target.

     It is styled here rather than through css/style.css on purpose: that
     stylesheet is mostly board, and the few lines this page uses are cheaper
     inlined than linked. The colours are the brand tokens from css/style.css.
     ================================================================== -->

<link rel="icon" href="/assets/favicon-32.png" type="image/png">
<link rel="icon" href="/assets/favicon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<style>
@font-face {
  font-family: "League Spartan";
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url("/assets/fonts/league-spartan-latin.woff2") format("woff2");
}
:root {
  --display: "League Spartan", "Futura", "Century Gothic", "Avenir Next", sans-serif;
  --brand: #004AAD;
  --brand-deep: #04367B;
  --ink: #0B1B33;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6vh 5vw;
  font-family: var(--display);
  color: var(--ink);
  background: radial-gradient(120% 100% at 30% 15%, #0a4a9e 0%, var(--brand-deep) 45%, #021f4a 100%);
}
.card {
  width: min(540px, 100%);
  padding: 40px 40px 34px;
  background: #ffffff;
  border-top: 6px solid var(--brand);
  box-shadow: 0 18px 50px rgba(2, 15, 40, 0.45);
}
.mark { display: block; width: 92px; height: auto; margin-bottom: 26px; }
h1 {
  margin: 0;
  font-weight: 800;
  font-size: clamp(64px, 16vw, 104px);
  line-height: 0.9;
  color: var(--brand-deep);
}
.said {
  margin: 18px 0 0;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--brand);
}
p.note { margin: 16px 0 0; font-size: 17px; line-height: 1.55; }
.home {
  display: inline-block;
  margin-top: 26px;
  padding: 0.8em 1.4em;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #ffffff;
  background: var(--brand);
  text-decoration: none;
}
.home:hover { background: var(--brand-deep); }
.sig {
  margin: 30px 0 0;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(11, 27, 51, 0.6);
}
:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
@media (max-width: 520px) { .card { padding: 30px 24px 26px; } }
</style>
</head>
<body>

  <a class="home" href="/">&larr; Back to the studio</a>

</html>
